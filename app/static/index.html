<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopfloor Copilot</title>
<style>
  :root { --bg:#f5f6f8; --fg:#111; --muted:#555; --card:#fff; --line:#c9cdd3; --accent:#0b5fd6; --on-accent:#fff;
          --warn-bg:#fff3cd; --warn-line:#b07d00; --err-bg:#fde8e8; --err-line:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#f2f4f7; --muted:#aab1bb; --card:#1b2027; --line:#3a424d; --accent:#5c9cff; --on-accent:#0a0f16;
            --warn-bg:#3a2f0b; --warn-line:#e0a800; --err-bg:#3d1515; --err-line:#ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { margin:0; font-size:1.5rem; }
  .sub { margin:4px 0 16px; color:var(--muted); font-size:.85rem; }
  textarea { width:100%; font:inherit; font-size:1rem; padding:12px; color:var(--fg); background:var(--card);
             border:2px solid var(--line); border-radius:10px; resize:vertical; }
  button { font:inherit; cursor:pointer; }
  #ask { width:100%; min-height:48px; margin-top:8px; font-weight:700; color:var(--on-accent); background:var(--accent);
         border:0; border-radius:10px; }
  #ask:disabled { opacity:.6; cursor:default; }
  #chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .chip { min-height:44px; padding:8px 14px; font-size:.9rem; color:var(--fg); background:var(--card);
          border:1px solid var(--line); border-radius:22px; }
  #status { margin:12px 0; color:var(--muted); }
  .card { margin-top:16px; padding:16px; background:var(--card); border:2px solid var(--line); border-radius:10px; }
  .card.warn { background:var(--warn-bg); border-color:var(--warn-line); }
  .card.err { background:var(--err-bg); border-color:var(--err-line); }
  .card h2 { margin:0 0 8px; font-size:1.05rem; }
  .text { white-space:pre-wrap; overflow-wrap:anywhere; }
  .sources { margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }
  .sources h2 { margin:0 0 8px; font-size:.95rem; color:var(--muted); }
  .src { display:block; padding:8px 0; color:var(--accent); font-weight:600; text-decoration:none; overflow-wrap:anywhere; }
  .src small { display:block; color:var(--muted); font-weight:400; font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1>Shopfloor Copilot</h1>
  <p class="sub">Answers from Kaveri Hosur plant SOPs and manuals</p>
  <textarea id="q" rows="3" maxlength="500" enterkeyhint="send" placeholder="Ask about an alarm, a procedure, a tolerance..."></textarea>
  <button id="ask" type="button">Ask</button>
  <div id="chips"></div>
  <div id="status" role="status"></div>
  <div id="out" aria-live="polite"></div>
</main>
<script>
  const q = document.getElementById("q"), btn = document.getElementById("ask");
  const status = document.getElementById("status"), out = document.getElementById("out");

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;  // textContent only, never innerHTML
    return e;
  }

  function card(cls, title, text) {
    const c = el("div", "card " + cls);
    if (title) c.append(el("h2", "", title));
    c.append(el("div", "text", text));
    return c;
  }

  function sources(list) {
    const box = el("div", "sources");
    box.append(el("h2", "", "Sources"));
    for (const s of list) {
      const a = el("a", "src", `${s.doc_no} Rev ${s.rev} | Section ${s.section}. ${s.heading} | p.${s.page}`);
      a.href = `/pdfs/${encodeURIComponent(s.file)}#page=${s.page}`;
      a.target = "_blank";
      a.rel = "noopener";
      a.append(el("small", "", `${s.title}, effective ${s.effective}`));
      box.append(a);
    }
    return box;
  }

  async function ask() {
    const question = q.value.trim();
    if (!question || btn.disabled) return;
    btn.disabled = true;
    status.textContent = "Searching documents...";
    out.replaceChildren();
    let result;
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.found) {
        result = card("", "", data.answer);
        result.append(sources(data.sources));
      } else if (res.ok) {
        result = card("warn", "Not found in the plant documents", data.answer);
      } else {
        const msg = res.status === 422 ? "Please type a question (up to 500 characters)."
          : typeof data.detail === "string" ? data.detail
          : "Something went wrong. Check the connection and try again.";
        result = card("err", "", msg);
      }
    } catch {
      result = card("err", "", "Cannot reach the copilot. Check that you are on the plant Wi-Fi.");
    }
    status.textContent = "";
    btn.disabled = false;
    out.append(result);
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  for (const text of ["Alarm AL-104, what to do?", "Who can remove a lockout lock?", "Coolant concentration for TX-200?"]) {
    const chip = el("button", "chip", text);
    chip.type = "button";
    chip.onclick = () => { q.value = text; ask(); };
    document.getElementById("chips").append(chip);
  }
  btn.onclick = ask;
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
  });
</script>
</body>
</html>
